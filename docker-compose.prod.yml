services:
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            app:
                condition: service_started
            socket:
                condition: service_started
            authentik-server:
                condition: service_healthy
        networks:
            - internal

    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
                - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        restart: unless-stopped
        command: ["node", "server.js"]
        environment:
            - NODE_ENV=production
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            - SESSION_SECRET=${SESSION_SECRET}
            - AI_PROVIDER=${AI_PROVIDER}
            - AI_MODEL=${AI_MODEL}
            - OPENAI_API_KEY=${OPENAI_API_KEY:-}
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
            - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
            - SOCKET_PORT=3001
            - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
            - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - internal

    socket:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        command: ["node", "--import", "tsx", "server/socket-server.ts"]
        environment:
            - NODE_ENV=production
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            - SESSION_SECRET=${SESSION_SECRET}
            - SOCKET_PORT=3001
            - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - internal

    postgres:
        image: postgres:17
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - internal

    authentik-db:
        image: postgres:17
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
            POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
            POSTGRES_DB: ${AUTHENTIK_POSTGRES_DB:-authentik}
        volumes:
            - authentik_db_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${AUTHENTIK_POSTGRES_USER:-authentik} -d ${AUTHENTIK_POSTGRES_DB:-authentik}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - internal

    authentik-redis:
        image: redis:alpine
        restart: unless-stopped
        command: --save 60 1 --loglevel warning
        volumes:
            - authentik_redis_data:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - internal

    authentik-server:
        image: ghcr.io/goauthentik/server:2025.4
        restart: unless-stopped
        command: server
        environment:
            AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
            AUTHENTIK_REDIS__HOST: authentik-redis
            AUTHENTIK_POSTGRESQL__HOST: authentik-db
            AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
            AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
            AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
            AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
            AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
            AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
        depends_on:
            authentik-db:
                condition: service_healthy
            authentik-redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "ak", "healthcheck"]
            interval: 10s
            timeout: 10s
            retries: 20
            start_period: 30s
        networks:
            - internal

    authentik-worker:
        image: ghcr.io/goauthentik/server:2025.4
        restart: unless-stopped
        command: worker
        environment:
            AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
            AUTHENTIK_REDIS__HOST: authentik-redis
            AUTHENTIK_POSTGRESQL__HOST: authentik-db
            AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
            AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
            AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
            AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
            AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
            AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
        depends_on:
            authentik-db:
                condition: service_healthy
            authentik-redis:
                condition: service_healthy
        networks:
            - internal

volumes:
    postgres_data:
    authentik_db_data:
    authentik_redis_data:

networks:
    internal:
        driver: bridge
