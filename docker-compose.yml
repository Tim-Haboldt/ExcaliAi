services:
    postgres:
        image: postgres:18.3
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: excaliAi
            POSTGRES_PASSWORD: excaliAi
            POSTGRES_DB: excaliAi
        volumes:
            - postgres_data:/var/lib/postgresql

volumes:
    postgres_data:
